<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mimodoro Timer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: system-ui, sans-serif;
    user-select: none;
  }
  #mode {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  #time {
    font-size: 76px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
  }
  #status {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.3);
    margin-top: 10px;
    text-transform: uppercase;
  }
  .controls {
    display: flex;
    gap: 14px;
    margin-top: 28px;
    align-items: center;
  }
  button {
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.07);
    transition: background .15s;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  .btn-sm { width: 40px; height: 40px; }
  #btn-play { width: 56px; height: 56px; background: #7c6fff; }
  #btn-play:hover { filter: brightness(1.15); background: #7c6fff; }
</style>
</head>
<body>
  <div id="mode">Focus</div>
  <div id="time">25:00</div>
  <div id="status">READY</div>

  <div class="controls">
    <button class="btn-sm" id="btn-reset" title="Reset">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>

    <button id="btn-play" title="Play / Pause">
      <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="white">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
      <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="white" style="display:none">
        <rect x="6" y="4" width="4" height="16"/>
        <rect x="14" y="4" width="4" height="16"/>
      </svg>
    </button>

    <button class="btn-sm" id="btn-skip" title="Skip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2">
        <polygon points="5,4 15,12 5,20"/>
        <line x1="19" y1="5" x2="19" y2="19"/>
      </svg>
    </button>
  </div>

  <script>
    const ch = new BroadcastChannel('mimodoro-timer');

    function pad(n) { return String(n).padStart(2, '0'); }

    ch.onmessage = function(e) {
      const { timeLeft, isRunning, mode, accentColor } = e.data;
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      const t = pad(m) + ':' + pad(s);

      document.getElementById('time').textContent = t;
      document.title = t + ' Mimodoro';
      document.getElementById('mode').textContent =
        mode === 'focus' ? 'Focus' : mode === 'short' ? 'Short Break' : 'Long Break';
      document.getElementById('status').textContent = isRunning ? 'RUNNING' : 'PAUSED';
      document.getElementById('btn-play').style.background = accentColor || '#7c6fff';
      document.getElementById('icon-play').style.display  = isRunning ? 'none'  : 'block';
      document.getElementById('icon-pause').style.display = isRunning ? 'block' : 'none';
    };

    document.getElementById('btn-reset').onclick = function() { ch.postMessage({ cmd: 'reset' }); };
    document.getElementById('btn-play').onclick  = function() { ch.postMessage({ cmd: 'toggle' }); };
    document.getElementById('btn-skip').onclick  = function() { ch.postMessage({ cmd: 'skip' }); };
  </script>
</body>
</html>
